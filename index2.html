<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HelpLife - Suporte e Cuidado Mental</title>
    <link rel="icon" href="./logo.jpg" type="image/jpeg">

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="login-page">
    <!-- Background -->
    <div class="background-overlay">
      <img
        src="https://images.unsplash.com/photo-1758274538961-fe8f1f24166f?w=1920&h=1080&fit=crop"
        alt="Background"
        class="background-image"
      />
      <div class="gradient-overlay"></div>
    </div>

    <!-- o card do -->
    <div class="login-container">
      <div class="login-card">
        <!-- Logo -->
        <div class="logo-container">
          <a href="community.html" class="logo-link">
             <img src="logo.jpeg" alt="Logo" width="50" height="50" style="border-radius: 50%;">
</a>
          </svg>
          <div>
            <h1 class="logo-title">HelpLife</h1>
            <p class="logo-subtitle">Suporte e Cuidado Mental</p>
          </div>
        </div>

        <!-- Welcome Text -->
        <div class="welcome-text">
          <h2>Bem-vindo!</h2>
          <p>Entre para acessar nossa plataforma de apoio</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="login-form">
          <div class="form-group">
            <label for="email">E-mail</label>
            <div class="input-wrapper">
              <svg
                class="input-icon"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="3" y="5" width="18" height="14" rx="2" />
                <path d="M3 7l9 6 9-6" />
              </svg>
              <input
                type="email"
                id="email"
                placeholder="seu@email.com"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="password">Senha</label>
            <div class="input-wrapper">
              <svg
                class="input-icon"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="5" y="11" width="14" height="10" rx="2" />
                <path d="M7 11V7a5 5 0 0110 0v4" />
              </svg>
              <input
                type="password"
                id="password"
                placeholder="Mínimo 8 caracteres"
                required
              />
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-large">
            Entrar
          </button>
          <p>
            caso não tenha uma conta, <a href="index3.html"> clique aqui</a>
          </p>
        </form>
      </div>
    </div>

    <script src="code.js"></script>
  </body>
</html>
